version: "0.2"
language: en-US,de-DE
import:
  - "@cspell/dict-de-de/cspell-ext.json"
dictionaryDefinitions:
  - name: accepted-words
    path: ./accepted-words.txt
    addWords: true
    caseSensitive: false
dictionaries:
  - accepted-words
ignoreRegExpList:
  - "\\[sound:[^\\]]+\\]"
  - "^#notetype:.*$"
  - "(?:^|[\\s,(])-[^\\s,()]+"
ignorePaths:
  - .cache
  - .claude
  - .venv
  - site
  - uv.lock
